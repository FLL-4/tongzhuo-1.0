# Copy this file to .secrets/api.yaml, fill in keys, then run:
# ./scripts/install-api-config.sh .secrets/api.yaml
# Never commit or add the copied file to an Xcode target.

text:
  provider: openai
  api_key: ""
  base_url: ""
  model: ""

image:
  provider: dashscope
  api_key: ""
  base_url: ""
  endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
  model: qwen-image-edit-plus
  size: 1024x1024
  scene_model: qwen-image-3.0
  scene_size: 1664x928

# Optional remove.bg post-processing. It turns the generated image into a
# transparent desk-pet foreground.
matting:
  provider: disabled
  api_key: ""
  endpoint: https://api.remove.bg/v1.0/removebg
